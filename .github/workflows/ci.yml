name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch instead of queueing them.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      # The assistant tests and the deploy check both need a live MongoDB.
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json
            api/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Install api (serverless) dependencies
        run: npm ci --prefix api

      # Fails if a dependency in the serverless bundle is missing from
      # api/package.json. Catches the class of bug where the handler cannot
      # import and every route 500s in production only.
      - name: Verify deployment surface
        run: npm run verify:deploy --prefix backend

      - name: Verify AI assistant coverage
        run: npm run test:ai --prefix backend
        env:
          MONGO_URI: mongodb://localhost:27017/ecommerce
          JWT_SECRET: ci-only-not-a-real-secret

      - name: Build frontend
        run: npm run build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail if a secret is committed
        run: |
          # Cheap guard against the most likely mistake: a real key landing in a
          # tracked file. Not a replacement for GitHub secret scanning.
          #
          # Lockfiles are excluded because base64 integrity hashes contain
          # substrings that match key patterns by chance, and .env.example is
          # excluded because it documents deliberate placeholders.
          if git grep -nE '(sk_(test|live)_[A-Za-z0-9]{20,}|AQ\.[A-Za-z0-9_-]{40,}|ghp_[A-Za-z0-9]{36}|AKIA[0-9A-Z]{16})' -- . ':!*package-lock.json' ':!.env.example' ; then
            echo "::error::A credential-shaped string is committed. Revoke it, then purge it from history."
            exit 1
          fi
          echo "no credential-shaped strings found"
